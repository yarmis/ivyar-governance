name: Documentation Quality Checks
on:
  pull_request:
    branches: [ "main" ]
jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint "**/*.md"
  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install codespell
        run: pip install codespell
      - name: Run spellcheck
        run: codespell --ignore-words-list="IVYAR,MSA,gov,dualuse" .
  yaml-validate:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint .
  version-check:
    name: Version Tag Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Ensure version tag exists
        run: |
          TAG_COUNT=$(git tag --list "v*" | wc -l)
          if [ "$TAG_COUNT" -eq 0 ]; then
            echo "No version tags found"
            exit 1
          fi
          echo "Version tags found"
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [markdown-lint, spellcheck, yaml-validate, version-check]
    steps:
      - name: All checks passed
        run: echo "All checks passed"
