name: IVYAR Validation Loop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  technical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run backend tests
        run: npm test tests/backend
      
      - name: Run API tests
        run: npm test tests/api

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      
      - name: Install dependencies
        run: pip install pytest requests
      
      - name: Run security tests
        run: pytest tests/security

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install Playwright
        run: npx playwright install
      
      - name: Run UI tests
        run: npx playwright test tests/ui
