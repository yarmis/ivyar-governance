    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        name_uk:
          type: string
        slug:
          type: string
        parent_id:
          type: string
          nullable: true
        domain:
          type: string
        part_count:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    # --------------------------------------------------------------------------
